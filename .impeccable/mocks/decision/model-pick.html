<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#F1F3F7;font-family:-apple-system,"PingFang SC",sans-serif;color:#10224A}
header{background:#1B3E8C;color:#fff;padding:52px 16px 16px}
h1{font-size:22px;font-weight:700;letter-spacing:.06em}
.sub{font-size:12px;opacity:.75;margin-top:4px}
.seg{display:flex;margin-top:14px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}
.seg span{flex:1;text-align:center;font-size:13px;padding:7px 0;border-radius:8px}
.seg .a{background:#fff;color:#1B3E8C;font-weight:600}
.filters{display:flex;gap:6px;padding:12px 16px;overflow:hidden}
.chip{flex:none;padding:6px 11px;border-radius:8px;background:#fff;border:1px solid #CBD3E3;font-size:13px}
.chip.a{background:#1B3E8C;color:#fff;border-color:#1B3E8C}
.list{padding:0 16px}
.plate{background:#1B3E8C;border-radius:10px;padding:4px;margin-bottom:12px;box-shadow:0 1px 0 #0E2560}
.inner{border:1.5px solid rgba(255,255,255,.85);border-radius:7px;padding:10px 12px;color:#fff}
.road{display:flex;justify-content:space-between;align-items:baseline}
.road b{font-size:19px;letter-spacing:.1em}
.road em{font-style:normal;font-size:26px;font-weight:700;font-family:"DIN Condensed","Arial Narrow",sans-serif}
.name{font-size:12px;opacity:.8;margin-top:2px}
.body{background:#fff;color:#10224A;border-radius:0 0 7px 7px;margin:4px -4px -4px;padding:10px 14px;font-size:13px;line-height:1.45}
.kids{color:#4A5A80;font-size:12px;margin-top:6px}
</style></head><body>
<header><h1>上海门牌</h1><div class="sub">陆家嘴出发 · 十二月 · 本地人常去的地方</div><div class="seg"><span class="a">候选</span><span>想去 7</span><span>去过 3</span></div></header>
<div class="filters"><span class="chip a">半天</span><span class="chip">室内</span><span class="chip">40 分钟内</span><span class="chip">艺术</span></div>
<div class="list">
<div class="plate"><div class="inner"><div class="road"><b>滨江大道</b><em>2777</em></div><div class="name">浦东美术馆 · 浦东新区</div></div><div class="body">本地人看大展、在镜厅拍对岸外滩。<div class="kids">9岁：镜厅 · 16岁：国际特展 · 约 3 小时</div></div></div>
<div class="plate"><div class="inner"><div class="road"><b>龙腾大道</b><em>2600</em></div><div class="name">西岸美术馆 · 徐汇区</div></div><div class="body">徐汇滨江的白领周末：看展、骑车、喝咖啡。<div class="kids">9岁：滨江骑车 · 16岁：当代艺术 · 半天</div></div></div>
<div class="plate"><div class="inner"><div class="road"><b>延安西路</b><em>1262</em></div><div class="name">上生·新所 · 长宁区</div></div></div>
</div></body></html>
