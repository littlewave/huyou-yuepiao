<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#0E5E5A;font-family:-apple-system,"PingFang SC",sans-serif;color:#14302C}
.num{font-family:"DIN Condensed","DIN Alternate","Arial Narrow",sans-serif}
header{padding:52px 16px 14px;color:#E6F2EC}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.top h1{font-size:15px;font-weight:600;letter-spacing:.08em}
.top .m{font-size:64px;line-height:.8;color:#F3D34A}
.sub{font-size:12px;opacity:.75;margin-top:6px}
.strip{margin-top:12px;display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.d{height:16px;border-radius:3px;background:rgba(230,242,236,.18);font-size:9px;text-align:center;line-height:16px;color:rgba(230,242,236,.6)}
.d.on{background:#E6F2EC;color:#0E5E5A}
.d.p{background:radial-gradient(circle,#0E5E5A 3.5px,#E6F2EC 4px)}
.filters{display:flex;gap:6px;padding:0 16px 12px;overflow:hidden}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid rgba(230,242,236,.35);color:#E6F2EC;font-size:13px}
.chip.a{background:#F3D34A;color:#14302C;border-color:#F3D34A;font-weight:600}
main{background:#E6F2EC;border-radius:18px 18px 0 0;height:600px;padding:14px 16px;background-image:repeating-linear-gradient(115deg,rgba(14,94,90,.05) 0 1px,transparent 1px 6px)}
.count{font-size:13px;color:#3C5E58;margin-bottom:10px;display:flex;justify-content:space-between}
.card{background:#fff;border-radius:12px;padding:14px 14px 12px 22px;margin-bottom:10px;position:relative;border-left:6px solid #2F5DA8}
.card::before{content:"";position:absolute;left:-14px;top:50%;width:16px;height:16px;border-radius:50%;background:#E6F2EC;transform:translateY(-50%)}
.card h2{font-size:17px;font-weight:650}
.meta{font-size:12px;color:#5A746F;margin-top:3px}
.why{font-size:13px;margin-top:8px;line-height:1.45}
.kids{display:flex;gap:6px;margin-top:8px;font-size:12px}
.kids span{background:#EEF4F1;padding:3px 8px;border-radius:6px}
.dur{margin-top:10px;height:6px;border-radius:3px;background:#DCE8E3}
.dur i{display:block;height:6px;border-radius:3px;background:#0E5E5A}
.stamp{position:absolute;right:12px;top:12px;border:2px solid #C8361F;color:#C8361F;font-size:12px;font-weight:700;padding:2px 6px;border-radius:4px;transform:rotate(-8deg)}
</style></head><body>
<header><div class="top"><div><h1>沪游月票 · 十二月</h1><div class="sub">陆家嘴出发 · 已探索 3 处 · 想去 7 处</div></div><div class="m num">12</div></div>
<div class="strip"><div class="d p"></div><div class="d p"></div><div class="d on num">3</div><div class="d num">4</div><div class="d num">5</div><div class="d p"></div><div class="d num">7</div><div class="d num">8</div><div class="d num">9</div><div class="d num">10</div><div class="d num">11</div><div class="d num">12</div><div class="d num">13</div><div class="d num">14</div><div class="d num">15</div><div class="d num">16</div></div></header>
<div class="filters"><span class="chip a">半天</span><span class="chip">室内</span><span class="chip">40 分钟内</span><span class="chip">艺术</span><span class="chip">书店</span></div>
<main><div class="count"><span>今天可选 · 6 处</span><span>随便来一个 ↻</span></div>
<div class="card"><h2>浦东美术馆</h2><div class="meta">浦东 · 滨江大道 · 步行 15 分钟</div><div class="why">本地人看大展、在镜厅拍对岸外滩的地方，看完沿东岸滨江走回家。</div><div class="kids"><span>9岁：镜厅、大空间</span><span>16岁：国际特展</span></div><div class="dur"><i style="width:40%"></i></div></div>
<div class="card" style="border-left-color:#E9B620"><span class="stamp">去过</span><h2>朵云书院·旗舰店</h2><div class="meta">上海中心 52 层 · 地铁 1 站</div><div class="why">云端的书店，白领下班来坐一会儿。</div><div class="kids"><span>9岁：高空看城市</span><span>16岁：选书、写作业</span></div><div class="dur"><i style="width:25%"></i></div></div>
<div class="card" style="border-left-color:#3E8E4E"><h2>世博文化公园</h2><div class="meta">浦东 · 地铁 25 分钟</div><div class="why">新开的城市大公园，温室花园冬天也暖。</div></div>
</main></body></html>
